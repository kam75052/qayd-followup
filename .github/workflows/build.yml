name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "نظام_القيود_والمتابعة" qayd_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: نظام-القيود-والمتابعة-Windows
          path: dist/*.exe
